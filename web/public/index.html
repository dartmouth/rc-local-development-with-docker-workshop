<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Guestbook</title>
  <style>
    :root { --bg: #e6ece8; --paper: #fbfcfa; --ink: #1c2a24; --muted: #5d6e66; --accent: #2f6f5e; --error: #a33a2c; color-scheme: light; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #151d1a; --paper: #1e2925; --ink: #e3ebe6; --muted: #93a59c; --accent: #6fbfa6; --error: #f08a7a; color-scheme: dark; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.55 "Iowan Old Style", "Palatino Linotype", Palatino, serif; }
    main { max-width: 38rem; margin: 0 auto; padding: 3rem 1.25rem; }
    h1 { font-size: 2.6rem; line-height: 1.1; margin: 0; }
    .visits { font-size: 1.1rem; color: var(--muted); margin: .5rem 0 2rem; }
    .visits strong { color: var(--accent); font-size: 1.6rem; }
    form { background: var(--paper); padding: 1.25rem; border-radius: 6px; display: grid; gap: .75rem; }
    input, textarea, button { font: inherit; color: inherit; }
    input, textarea { background: var(--bg); border: 1px solid var(--muted); border-radius: 4px; padding: .5rem .65rem; }
    textarea { min-height: 5rem; resize: vertical; }
    button { justify-self: start; background: var(--accent); color: var(--paper); border: 0; border-radius: 4px; padding: .5rem 1.1rem; cursor: pointer; }
    :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    #error { color: var(--error); min-height: 1.5em; }
    ol { list-style: none; padding: 0; }
    li { padding: 1rem 0; border-bottom: 1px solid color-mix(in srgb, var(--muted) 35%, transparent); }
    li .meta { color: var(--muted); font-size: .9rem; }
    .words { color: var(--muted); font-size: .9rem; }
  </style>
</head>
<body>
  <main>
    <h1>Guestbook</h1>
    <p class="visits">Visitors so far: <strong id="visits">…</strong></p>

    <form id="sign">
      <input id="name" placeholder="Your name" maxlength="40" required aria-label="Your name">
      <textarea id="text" placeholder="Leave a message" maxlength="280" required aria-label="Message"></textarea>
      <button type="submit">Sign the guestbook</button>
    </form>
    <p id="error" role="alert"></p>

    <ol id="messages"></ol>
    <p class="words">Words counted by the worker: <span id="words">0</span></p>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);

    async function call(path, options = {}) {
      const res = await fetch("/api" + path, { headers: { "Content-Type": "application/json" }, ...options });
      const data = await res.json().catch(() => ({ error: `Unexpected response (${res.status})` }));
      if (!res.ok) throw new Error(data.error || `Request failed (${res.status})`);
      return data;
    }

    function showError(err) { $("error").textContent = err ? err.message : ""; }

    async function loadMessages() {
      const { messages, words_counted } = await call("/messages");
      $("words").textContent = words_counted;
      $("messages").replaceChildren(...(messages.length ? messages : [{ empty: true }]).map((m) => {
        const li = document.createElement("li");
        if (m.empty) { li.textContent = "No messages yet. Be the first to sign."; return li; }
        const meta = document.createElement("div");
        meta.className = "meta";
        meta.textContent = `${m.name}, ${new Date(m.at * 1000).toLocaleString()}`;
        const text = document.createElement("div");
        text.textContent = m.text;
        li.append(text, meta);
        return li;
      }));
    }

    $("sign").addEventListener("submit", async (e) => {
      e.preventDefault();
      try {
        await call("/messages", { method: "POST", body: JSON.stringify({ name: $("name").value, text: $("text").value }) });
        $("text").value = "";
        showError(null);
        await loadMessages();
      } catch (err) { showError(err); }
    });

    (async () => {
      try {
        $("visits").textContent = (await call("/visits", { method: "POST" })).visits;
        await loadMessages();
      } catch (err) { $("visits").textContent = "?"; showError(err); }
    })();
  </script>
</body>
</html>
